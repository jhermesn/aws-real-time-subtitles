name: destroy

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Resource name prefix (overrides vars.TF_PREFIX)"
        required: false
      aws_region:
        description: "AWS region (overrides vars.AWS_REGION)"
        required: false
      admin_ips:
        description: "Comma-separated IPv4 CIDRs (overrides vars.ADMIN_IPS)"
        required: false
      enable_waf:
        description: "Enable WAF (true/false, overrides vars.ENABLE_WAF)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      INPUT_PREFIX: ${{ inputs.prefix || vars.TF_PREFIX }}
      INPUT_AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION }}
      INPUT_ADMIN_IPS: ${{ inputs.admin_ips || vars.ADMIN_IPS }}
      INPUT_ENABLE_WAF: ${{ inputs.enable_waf || vars.ENABLE_WAF || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.INPUT_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.INPUT_AWS_REGION }}"

      - name: Empty S3 app bucket before destroy
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${INPUT_PREFIX}-app-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            # Must delete all versions and delete markers before Terraform can remove the bucket.
            # aws s3 rm --recursive only creates delete markers on versioned buckets.
            aws s3api list-object-versions --bucket "$BUCKET" \
              --output text --query 'Versions[*].[Key,VersionId]' \
              | while IFS=$'\t' read -r key ver; do
                  aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$ver"
                done
            aws s3api list-object-versions --bucket "$BUCKET" \
              --output text --query 'DeleteMarkers[*].[Key,VersionId]' \
              | while IFS=$'\t' read -r key ver; do
                  aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$ver"
                done
          fi

      - name: Convert ADMIN_IPS to Terraform list
        run: |
          TF_ADMIN_IPS=$(echo "$INPUT_ADMIN_IPS" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          ips = [ip.strip() for ip in raw.split(',') if ip.strip()]
          print(json.dumps(ips))
          ")
          echo "TF_VAR_admin_ips=$TF_ADMIN_IPS" >> "$GITHUB_ENV"

      - name: Terraform destroy
        working-directory: terraform
        env:
          TF_VAR_prefix: ${{ env.INPUT_PREFIX }}
          TF_VAR_aws_region: ${{ env.INPUT_AWS_REGION }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_signing_secret: ${{ secrets.SIGNING_SECRET }}
          TF_VAR_enable_waf: ${{ env.INPUT_ENABLE_WAF }}
        run: terraform destroy -auto-approve
